<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CivicFix — Report park maintenance issues, track complaints and help restore your community green spaces." />
    <meta name="theme-color" content="#2E4036" />

    <!-- Favicon SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232E4036'/%3E%3Cpath d='M16 6 C16 6 10 11 10 17 C10 20.3 12.7 23 16 23 C19.3 23 22 20.3 22 17 C22 11 16 6 16 6Z' fill='%23A9C5A9'/%3E%3Cpath d='M16 23 L16 27' stroke='%23CC5833' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='28' r='1.5' fill='%23CC5833'/%3E%3C/svg%3E" />

    <!-- Google Fonts: Plus Jakarta Sans, Cormorant Garamond, Outfit, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Cormorant+Garamond:ital,wght@1,600&family=Outfit:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>CivicFix — Better parks begin with a report.</title>

    <!-- SVG noise filter — applied as full-screen overlay via CSS -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <defs>
        <filter id="cf-noise">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.65"
            numOctaves="3"
            stitchTiles="stitch"
          />
          <feColorMatrix type="saturate" values="0" />
        </filter>
      </defs>
    </svg>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
